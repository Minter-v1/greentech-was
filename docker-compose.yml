name: greentech-was

services:
  mysql:
    image: mysql:8.4
    container_name: greentech-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root1234}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-greentech_hr}
      MYSQL_USER: ${MYSQL_USER:-greentech}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-greentech1234}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+09:00
      - --innodb-buffer-pool-size=1G
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root1234}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: greentech-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-greentech_hr}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USERNAME: ${MYSQL_USER:-greentech}
      DB_PASSWORD: ${MYSQL_PASSWORD:-greentech1234}
      JWT_SECRET: ${JWT_SECRET:-0VUHInPxY0okpsu6yRAveTdSbYbC9PqCjcMvvrA94ZQNMsdd}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-s9Ic2OTzBfKOLeBmRM2oQB0ls6HHIKWC3s3Y9CP+6+Q=}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:-greentech1234!}
      FILE_STORAGE_ROOT: /app/uploads
      TZ: Asia/Seoul
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - app-uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  mysql-data:
  app-uploads:
