name: greentech-was

services:
  mysql:
    image: mysql:8.4
    container_name: greentech-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?.env 에 MYSQL_ROOT_PASSWORD 설정 필요}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-greentech_hr}
      MYSQL_USER: ${MYSQL_USER:-greentech}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?.env 에 MYSQL_PASSWORD 설정 필요}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+09:00
      - --innodb-buffer-pool-size=1G
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: greentech-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-greentech_hr}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USERNAME: ${MYSQL_USER:-greentech}
      DB_PASSWORD: ${MYSQL_PASSWORD:?.env 에 MYSQL_PASSWORD 설정 필요}
      JWT_SECRET: ${JWT_SECRET:?.env 에 JWT_SECRET 설정 필요}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?.env 에 FIELD_ENCRYPTION_KEY 설정 필요}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?.env 에 ADMIN_USERNAME 설정 필요}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?.env 에 ADMIN_PASSWORD 설정 필요}
      ADMIN_RESET_PASSWORD: ${ADMIN_RESET_PASSWORD:-false}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      FILE_STORAGE_ROOT: /app/uploads
      NCP_STORAGE_ENDPOINT: ${NCP_STORAGE_ENDPOINT:-https://kr.object.private.ncloudstorage.com}
      NCP_STORAGE_REGION: ${NCP_STORAGE_REGION:-kr-standard}
      NCP_STORAGE_BUCKET: ${NCP_STORAGE_BUCKET:-}
      NCP_STORAGE_ACCESS_KEY: ${NCP_STORAGE_ACCESS_KEY:-}
      NCP_STORAGE_SECRET_KEY: ${NCP_STORAGE_SECRET_KEY:-}
      TZ: Asia/Seoul
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - app-uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  mysql-data:
  app-uploads:
