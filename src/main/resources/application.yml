spring:
  application:
    name: greentech-was

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/greentech_hr?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:greentech}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 10000
      pool-name: greentech-hikari

  jpa:
    hibernate:
      # NOTE: 스키마는 Flyway 소유, Hibernate 는 검증만
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
          time_zone: Asia/Seoul
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
  default-produces-media-type: application/json

app:
  security:
    # NOTE: 시크릿 기본값 금지. 미설정 시 기동 실패로 유도
    jwt-secret: ${JWT_SECRET}
    access-token-ttl: ${ACCESS_TOKEN_TTL:8h}
    field-encryption-key: ${FIELD_ENCRYPTION_KEY}
    admin:
      username: ${ADMIN_USERNAME}
      password: ${ADMIN_PASSWORD}
      reset-password-on-start: ${ADMIN_RESET_PASSWORD:false}
  storage:
    root: ${FILE_STORAGE_ROOT:./uploads}

logging:
  level:
    com.greentech: ${LOG_LEVEL_APP:DEBUG}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:DEBUG}
    org.flywaydb: INFO
